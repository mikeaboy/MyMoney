version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mymoney-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "全方位整合帳務與跨幣別資產管理系統"
      APP_ENV: local
      APP_KEY: "base64:XG8d2mB79yF2kM8k1s4Wz7Q0xL8v9A1b2C3d4E5f6G7="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage

